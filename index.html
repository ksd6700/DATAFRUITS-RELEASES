    <header class="masthead">

        <div class="masthead__side">

        </div>
      </div>
    </header>

    <main class="app-shell">
      <section id="releaseToolbar" class="toolbar" aria-label="release controls">
        <label class="search-box">
          <span class="search-box__icon" aria-hidden="true"></span>
          <span class="visually-hidden">Search releases</span>
          <input id="searchInput" type="search" placeholder="Search catalog, artist, title, tag">
        </label>

        <label class="select-box">
          <span>Series</span>
          <select id="seriesFilter"></select>
        </label>

        <label class="select-box">
          <span>Artist</span>
          <select id="artistFilter"></select>
        </label>

        <div class="view-toggle" role="group" aria-label="display mode">
          <button id="gridViewButton" type="button" aria-pressed="true" title="Grid view">
            <span class="icon-grid" aria-hidden="true"></span>
            <span>Grid</span>
          </button>
          <button id="listViewButton" type="button" aria-pressed="false" title="List view">
            <span class="icon-list" aria-hidden="true"></span>
            <span>List</span>
          </button>
        </div>
      </section>

      <section class="results-head" aria-live="polite">
        <h2 id="resultsTitle">Releases</h2>
        <p id="resultsMeta">Waiting for TSV rows.</p>
      </section>

      <section id="releaseGrid" class="release-grid" aria-label="release list"></section>
      <div id="loadSentinel" class="load-sentinel" hidden aria-live="polite"></div>

      <template id="emptyTemplate">
        <div class="empty-state">
          <h2>No releases found</h2>
          <p>Try another search or series filter.</p>
        </div>
      </template>
